<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Exam Performance Indicator</title>
</head>
<body style="margin:0; padding:40px 16px; min-height:100vh; background-color:#f7f7f8; font-family: Arial, Helvetica, sans-serif; box-sizing:border-box;">

  <div style="max-width:520px; margin:0 auto; background-color:#ffffff; border:1px solid #e5e5e8; border-radius:10px; padding:36px 32px; box-shadow:0 2px 8px rgba(0,0,0,0.05); box-sizing:border-box;">

    <h1 style="margin:0 0 4px 0; font-size:22px; font-weight:700; color:#1a1a1a; text-align:center;">
      Student Exam Performance Indicator
    </h1>
    <p style="margin:0 0 28px 0; font-size:14px; color:#6b6b70; text-align:center;">
      Fill in the details below to predict the maths score
    </p>

    <form action="{{ url_for('predict_datapoint')}}" method="post">

      <div style="margin-bottom:18px;">
        <label style="display:block; margin-bottom:6px; font-size:13px; font-weight:600; color:#333;">Gender</label>
        <select name="gender" required
          style="width:100%; padding:10px 12px; font-size:14px; color:#1a1a1a; border:1px solid #d1d1d6; border-radius:6px; background-color:#fff; box-sizing:border-box;">
          <option selected disabled value="">Select your Gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </div>

      <div style="margin-bottom:18px;">
        <label style="display:block; margin-bottom:6px; font-size:13px; font-weight:600; color:#333;">Race or Ethnicity</label>
        <select name="ethnicity" required
          style="width:100%; padding:10px 12px; font-size:14px; color:#1a1a1a; border:1px solid #d1d1d6; border-radius:6px; background-color:#fff; box-sizing:border-box;">
          <option selected disabled value="">Select Ethnicity</option>
          <option value="group A">Group A</option>
          <option value="group B">Group B</option>
          <option value="group C">Group C</option>
          <option value="group D">Group D</option>
          <option value="group E">Group E</option>
        </select>
      </div>

      <div style="margin-bottom:18px;">
        <label style="display:block; margin-bottom:6px; font-size:13px; font-weight:600; color:#333;">Parental Level of Education</label>
        <select name="parental_level_of_education" required
          style="width:100%; padding:10px 12px; font-size:14px; color:#1a1a1a; border:1px solid #d1d1d6; border-radius:6px; background-color:#fff; box-sizing:border-box;">
          <option selected disabled value="">Select Parent Education</option>
          <option value="associate's degree">associate's degree</option>
          <option value="bachelor's degree">bachelor's degree</option>
          <option value="high school">high school</option>
          <option value="master's degree">master's degree</option>
          <option value="some college">some college</option>
          <option value="some high school">some high school</option>
        </select>
      </div>

      <div style="margin-bottom:18px;">
        <label style="display:block; margin-bottom:6px; font-size:13px; font-weight:600; color:#333;">Lunch Type</label>
        <select name="lunch" required
          style="width:100%; padding:10px 12px; font-size:14px; color:#1a1a1a; border:1px solid #d1d1d6; border-radius:6px; background-color:#fff; box-sizing:border-box;">
          <option selected disabled value="">Select Lunch Type</option>
          <option value="free/reduced">free/reduced</option>
          <option value="standard">standard</option>
        </select>
      </div>

      <div style="margin-bottom:18px;">
        <label style="display:block; margin-bottom:6px; font-size:13px; font-weight:600; color:#333;">Test Preparation Course</label>
        <select name="test_preparation_course" required
          style="width:100%; padding:10px 12px; font-size:14px; color:#1a1a1a; border:1px solid #d1d1d6; border-radius:6px; background-color:#fff; box-sizing:border-box;">
          <option selected disabled value="">Select Test Course</option>
          <option value="none">None</option>
          <option value="completed">Completed</option>
        </select>
      </div>

      <div style="margin-bottom:18px;">
        <label style="display:block; margin-bottom:6px; font-size:13px; font-weight:600; color:#333;">Reading Score out of 100</label>
        <input type="number" name="reading_score" min="0" max="100" required placeholder="Enter your Reading score"
          style="width:100%; padding:10px 12px; font-size:14px; color:#1a1a1a; border:1px solid #d1d1d6; border-radius:6px; box-sizing:border-box;" />
      </div>

      <div style="margin-bottom:24px;">
        <label style="display:block; margin-bottom:6px; font-size:13px; font-weight:600; color:#333;">Writing Score out of 100</label>
        <input type="number" name="writing_score" min="0" max="100" required placeholder="Enter your Writing score"
          style="width:100%; padding:10px 12px; font-size:14px; color:#1a1a1a; border:1px solid #d1d1d6; border-radius:6px; box-sizing:border-box;" />
      </div>

      <div>
        <input type="submit" value="Predict your Maths Score"
          style="width:100%; padding:12px; font-size:14px; font-weight:600; color:#ffffff; background-color:#2563eb; border:none; border-radius:6px; cursor:pointer;" />
      </div>

    </form>

    <h2 style="margin:24px 0 0 0; padding-top:18px; border-top:1px solid #e5e5e8; font-size:16px; font-weight:600; color:#1a1a1a; text-align:center;">
      The prediction is {{ results }}
    </h2>

  </div>

</body>
</html>
